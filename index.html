<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Organiza tus barajas de cartas con fotos, marcas, precios y fechas de compra."><title>Colección · Mi colección</title><link rel="stylesheet" href="coleccion.css"><header><a class="logo" href="index.html"><span>♠</span> Colección</a><nav><a id="collection" href="index.html">Mi colección</a><a id="wishes" href="wishlist.html">Wishlist</a></nav></header><main><div class="heading"><h1 id="title"></h1><button class="add" id="add">＋ Añadir baraja</button></div><div class="toolbar"><div class="group"><label>Marca <select id="filter"></select></label><label>Orden <select id="sort"><option value="num">Número de baraja</option><option value="p">Precio · menor a mayor</option><option value="P">Precio · mayor a menor</option><option value="q">Cantidad · menor a mayor</option><option value="Q">Cantidad · mayor a menor</option><option value="d">Compra · más antigua</option><option value="D">Compra · más reciente</option></select></label></div><span class="count" id="count"></span></div><section class="shelf" id="shelf"></section></main>
<dialog id="detail"><div class="sheet"><header><button id="back">← Volver</button><span class="meta" id="ref"></span></header><div class="detail"><div><img class="heroimg" id="hero" alt=""><div class="pager"><button aria-label="Foto anterior" id="prev">←</button><span class="page" id="page"></span><button aria-label="Foto siguiente" id="next">→</button></div></div><article><div class="meta" id="maker"></div><h2 id="name"></h2><p class="desc" id="desc"></p><dl id="facts"></dl><div class="group"><button id="edit">Editar baraja</button><button id="replay">Repetir giro</button></div></article></div></div></dialog>
<dialog id="editor"><header><h2 id="formtitle"></h2><button aria-label="Cerrar" id="cancel">×</button></header><form id="form"><div class="editgrid"><label class="wide">Nombre<input name="name" required maxlength="90"></label><label>Marca<select name="brand"></select></label><label id="newlabel" hidden>Nueva marca<input name="custom" maxlength="50"></label><label>Número de baraja<input name="num" type="number" min="1" required></label><label>Precio (€)<input name="price" type="number" step=".01" min="0" required></label><label>Ejemplares<input name="qty" type="number" min="0" required></label><label>Fecha de compra<input name="date" type="date"></label><label class="wide">Descripción<textarea name="desc" rows="2"></textarea></label><label class="wide" id="photosLabel"><span>Importar fotografías</span><input name="files" type="file" accept="image/*" multiple></label></div><p class="err" role="alert" id="error"></p><div class="actions"><button type="button" id="deleteDeck" hidden>Eliminar baraja</button><button class="add" type="submit">Guardar baraja</button></div></form></dialog><dialog id="confirmDelete" aria-labelledby="deleteTitle" aria-describedby="deletePrompt"><h2 id="deleteTitle">Eliminar baraja</h2><p id="deletePrompt"></p><p class="err" id="deleteError" role="alert"></p><div class="actions"><button type="button" id="keepDeck" autofocus>Cancelar</button><button type="button" class="add" id="confirmRemoval">Sí, eliminar</button></div></dialog><script src="coleccion.js" defer></script></html>
